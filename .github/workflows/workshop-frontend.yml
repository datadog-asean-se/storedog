name: Workshop Frontend Image

# Builds the modified frontend (OpenFeature + DatadogProvider) and pushes
# to ghcr.io/datadog-asean-se/storedog/frontend:workshop
# so students can pull a pre-built image instead of compiling locally.

on:
  push:
    branches: [workshop/featureflags-rum]
    paths:
      - services/frontend/**
      - .github/workflows/workshop-frontend.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 — lab host architecture)
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/datadog-asean-se/storedog/frontend:workshop
            ghcr.io/datadog-asean-se/storedog/frontend:workshop-${{ github.sha }}
          build-args: |
            DD_GIT_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            DD_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
