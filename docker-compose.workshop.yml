# Storedog Feature Flags × RUM Workshop — Pre-built image compose
#
# Replaces the lab's docker-compose.yml with:
#  - frontend: ghcr.io/datadog-asean-se/storedog/frontend:workshop
#              (our fork: OpenFeature + DatadogProvider + RUM flag tracking)
#  - all other services: same public.ecr.aws ECR images the lab already uses
#              (likely already cached on the lab host — no re-download)
#
# Usage (from /root/storedog-ff after storedog-ff-lab.sh step 4):
#   docker compose -f docker-compose.workshop.yml pull
#   docker compose -f docker-compose.workshop.yml up -d
#
# Required .env vars (from /root/lab/.env):
#   DD_API_KEY, DD_APP_KEY, DD_APPLICATION_ID, DD_CLIENT_TOKEN,
#   DD_HOSTNAME, DD_ENV, STOREDOG_URL

services:
  dd-agent:
    image: gcr.io/datadoghq/agent:7.59.0
    environment:
      - DD_API_KEY
      - DD_HOSTNAME
      - DD_TAGS
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_CONTAINER_LABELS_AS_TAGS={"my.custom.label.team":"team"}
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_SYSTEM_PROBE_NETWORK_ENABLED=true
    pid: "host"
    ports:
      - "8126:8126/tcp"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - postgres_logs:/var/log/pg_log:ro
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - IPC_LOCK
      - CHOWN
    security_opt:
      - apparmor:unconfined

  # Workshop frontend: pre-built with OpenFeature + DatadogProvider changes.
  # Runs npm run build then npm run start (production mode, same as lab).
  # NEXT_PUBLIC_* vars are picked up at build time inside the container.
  frontend:
    image: ghcr.io/datadog-asean-se/storedog/frontend:workshop
    command: bash -c "wait-for-it backend:4000 -- npm run build && npm run start"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_LOGS_INJECTION=true
      - DD_SERVICE=store-frontend
      - DD_VERSION=workshop
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      # Bridge lab env var names → NEXT_PUBLIC_* (required for Next.js browser access)
      - NEXT_PUBLIC_DD_APPLICATION_ID=${DD_APPLICATION_ID}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${DD_CLIENT_TOKEN}
      - NEXT_PUBLIC_DD_SITE=${DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_DD_ENV=${DD_ENV:-workshop}
      - NEXT_PUBLIC_DD_SERVICE_FRONTEND=store-frontend
    depends_on:
      - dd-agent
      - backend
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "store-frontend"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-frontend"
      my.custom.label.team: "frontend"

  backend:
    image: public.ecr.aws/x2b9z2t7/storedog/backend:1.2.4
    command: wait-for-it postgres:5432 -- bundle exec rails s -b 0.0.0.0 -p 4000
    depends_on:
      - dd-agent
      - postgres
      - redis
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - DB_HOST=postgres
      - DB_PORT=5432
      - RAILS_ENV=development
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-backend
      - DD_VERSION=1.2.4
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "service": "store-backend", "auto_multi_line_detection":true}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-backend"
      my.custom.label.team: "backend"

  worker:
    image: public.ecr.aws/x2b9z2t7/storedog/backend:1.2.4
    command: wait-for-it postgres:5432 -- bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      - dd-agent
      - postgres
      - redis
    environment:
      - REDIS_URL
      - DB_HOST=postgres
      - DB_PORT=5432
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-worker
      - DD_VERSION=1.2.4
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "service": "store-worker"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-worker"
      my.custom.label.team: "backend"

  ads-java:
    image: public.ecr.aws/x2b9z2t7/storedog/ads-java:1.2.4
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-ads
      - DD_VERSION=1.2.4
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
    ports:
      - "${ADS_PORT:-9292}:8080"
    depends_on:
      - dd-agent
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "store-ads"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-ads-java"
      my.custom.label.team: "advertisements"

  discounts:
    image: public.ecr.aws/x2b9z2t7/storedog/discounts:1.2.4
    command: wait-for-it postgres:5432 -- ./my-wrapper-script.sh ${DISCOUNTS_PORT:-2814}
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-discounts
      - DD_VERSION=1.2.4
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - BROKEN_DISCOUNTS=${BROKEN_DISCOUNTS:-DISABLED}
    ports:
      - "${DISCOUNTS_PORT:-2814}:${DISCOUNTS_PORT:-2814}"
    depends_on:
      - dd-agent
      - postgres
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "store-discounts"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-discounts"
      my.custom.label.team: "discounts"

  postgres:
    image: public.ecr.aws/x2b9z2t7/storedog/postgres:1.2.5
    command: ["postgres", "-c", "config_file=/postgresql.conf"]
    restart: always
    volumes:
      - postgres_logs:/var/log/pg_log:rw
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - DD_AGENT_HOST=dd-agent
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      - dd-agent
    labels:
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "database"
      com.datadoghq.ad.check_names: '["postgres"]'
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":5432, "username":"datadog", "password":"datadog"}]'
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service": "database", "auto_multi_line_detection":true, "path": "/var/log/pg_log/postgresql*.json", "type": "file"}]'

  redis:
    image: redis:6.2-alpine
    volumes:
      - redis:/data
    depends_on:
      - dd-agent
    labels:
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "redis"
      com.datadoghq.ad.check_names: '["redisdb"]'
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6379}]'
      com.datadoghq.ad.logs: '[{"source": "redis", "service": "redis"}]'

  nginx:
    image: public.ecr.aws/x2b9z2t7/storedog/nginx:1.2.4
    restart: always
    ports:
      - "80:80"
    depends_on:
      - dd-agent
      - frontend
    labels:
      com.datadoghq.ad.logs: '[{"source": "nginx", "service": "store-nginx"}]'
      com.datadoghq.ad.check_names: '["nginx"]'
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"nginx_status_url": "http://%%host%%:81/nginx_status/"}]'

  puppeteer:
    image: ghcr.io/puppeteer/puppeteer:20.9.0
    volumes:
      - ./services/puppeteer/scripts/puppeteer.js:/home/pptruser/puppeteer.js
    environment:
      - STOREDOG_URL
      - PUPPETEER_TIMEOUT
      - SKIP_SESSION_CLOSE
    command: node puppeteer.js
    depends_on:
      - frontend

volumes:
  redis:
  postgres_logs:
