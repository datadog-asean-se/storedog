# Storedog Feature Flags × RUM Workshop — Pre-built image compose file
#
# Uses pre-built images so students skip the 5+ min compilation step:
#   frontend  → ghcr.io/datadog-asean-se/storedog/frontend:workshop
#               (our fork with OpenFeature + DatadogProvider changes)
#   all other → ghcr.io/datadog/storedog/<service>:latest
#               (official upstream images, unchanged)
#
# Usage:
#   docker compose -f docker-compose.workshop.yml pull
#   docker compose -f docker-compose.workshop.yml up -d
#
# Required .env vars:
#   DD_API_KEY, DD_APP_KEY, DD_APPLICATION_ID, DD_CLIENT_TOKEN, STOREDOG_URL

services:
  dd-agent:
    image: registry.datadoghq.com/agent:latest
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_ENV=${DD_ENV:-workshop}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE=image:agent name:puppeteer
      - DD_CLOUD_PROVIDER_METADATA=[]
      - DD_HOSTNAME=${DD_HOSTNAME:-workshop-host}
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
    networks:
      - storedog-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - postgres_logs:/var/log/pg_log:ro

  # Workshop-modified frontend: OpenFeature + DatadogProvider wired in
  frontend:
    image: ghcr.io/datadog-asean-se/storedog/frontend:workshop
    command: bash -c "wait-for-it backend:4000 -- npm run dev"
    depends_on:
      - worker
      - dd-agent
      - backend
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-workshop}
      - DD_SERVICE=store-frontend-api
      - DD_VERSION=${DD_VERSION_FRONTEND:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
      # RUM credentials — bridged from the lab's .env naming convention
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID:-${DD_APPLICATION_ID:-DD_APPLICATION_ID-not-set}}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN:-${DD_CLIENT_TOKEN:-DD_CLIENT_TOKEN-not-set}}
      - NEXT_PUBLIC_DD_SITE=${DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_DD_SERVICE_FRONTEND=store-frontend
      - NEXT_PUBLIC_DD_ENV=${DD_ENV:-workshop}
      - NEXT_PUBLIC_FRONTEND_API_ROUTE=http://service-proxy:80
      - NEXT_PUBLIC_SPREE_API_HOST=http://service-proxy/services/backend
      - NEXT_PUBLIC_SPREE_CLIENT_HOST=/services/backend
      - NEXT_PUBLIC_SPREE_IMAGE_HOST=/services/backend
      - NEXT_PUBLIC_SPREE_ALLOWED_IMAGE_DOMAIN=service-proxy
      - NEXT_PUBLIC_ADS_ROUTE=/services/ads
      - NEXT_PUBLIC_DISCOUNTS_ROUTE=/services/discounts
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "auto_multi_line_detection": true}]'

  backend:
    image: ghcr.io/datadog/storedog/backend:latest
    command: wait-for-it postgres:5432 -- bundle exec ddprofrb exec rails s -b 0.0.0.0 -p 4000 --pid /app/tmp/pids/server.pid
    depends_on:
      - postgres
      - redis
      - dd-agent
    networks:
      - storedog-network
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DISABLE_SPRING=1
      - RAILS_ENV=production
      - DB_POOL=25
      - MAX_THREADS=5
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-workshop}
      - DD_SERVICE=store-backend
      - DD_VERSION=${DD_VERSION_BACKEND:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "auto_multi_line_detection": true}]'

  worker:
    image: ghcr.io/datadog/storedog/backend:latest
    command: wait-for-it postgres:5432 -- bundle exec ddprofrb exec sidekiq -C config/sidekiq.yml
    depends_on:
      - postgres
      - redis
      - backend
      - dd-agent
    networks:
      - storedog-network
    environment:
      - WORKER=true
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DISABLE_SPRING=1
      - DB_POOL=25
      - MAX_THREADS=5
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-workshop}
      - DD_SERVICE=store-worker
      - DD_VERSION=${DD_VERSION_BACKEND:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "auto_multi_line_detection": true}]'

  discounts:
    image: ghcr.io/datadog/storedog/discounts:latest
    command: /usr/bin/dumb-init -- ddtrace-run flask run --port=2814 --host=0.0.0.0
    depends_on:
      - postgres
      - dd-agent
    networks:
      - storedog-network
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-workshop}
      - DD_SERVICE=store-discounts
      - DD_VERSION=${DD_VERSION_DISCOUNTS:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "python"}]'

  ads:
    image: ghcr.io/datadog/storedog/ads:latest
    depends_on:
      - postgres
      - dd-agent
    networks:
      - storedog-network
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-workshop}
      - DD_SERVICE=store-ads
      - DD_VERSION=${DD_VERSION_ADS:-1.0.0}
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  service-proxy:
    image: ghcr.io/datadog/storedog/service-proxy:latest
    restart: always
    ports:
      - '80:80'
    networks:
      - storedog-network
    depends_on:
      - frontend
      - dd-agent
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-workshop}
      - DD_SERVICE=service-proxy
    labels:
      com.datadoghq.ad.logs: '[{"source": "nginx"}]'
      com.datadoghq.ad.check_names: '["nginx"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"nginx_status_url": "http://%%host%%:81/nginx_status/"}]'

  postgres:
    image: ghcr.io/datadog/storedog/postgres:latest
    restart: always
    depends_on:
      - dd-agent
    volumes:
      - postgres_logs:/var/log/pg_log:rw
    networks:
      - storedog-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    labels:
      com.datadoghq.tags.service: 'store-db'
      com.datadoghq.ad.check_names: '["postgres"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":5432, "username":"datadog", "password":"datadog"}]'
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service":"store-db", "auto_multi_line_detection": true, "path": "/var/log/pg_log/postgresql*.json", "type": "file"}]'

  redis:
    image: redis:6.2-alpine
    depends_on:
      - dd-agent
    networks:
      - storedog-network
    labels:
      com.datadoghq.tags.service: 'redis'
      com.datadoghq.ad.check_names: '["redisdb"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6379}]'
      com.datadoghq.ad.logs: '[{"source": "redis"}]'

  puppeteer:
    image: ghcr.io/datadog/storedog/puppeteer:latest
    platform: linux/amd64
    environment:
      - STOREDOG_URL=${STOREDOG_URL:-http://service-proxy:80}
      - PUPPETEER_TIMEOUT=${PUPPETEER_TIMEOUT:-30000}
      - SKIP_SESSION_CLOSE=${SKIP_SESSION_CLOSE:-false}
    networks:
      - storedog-network
    volumes:
      - ./services/puppeteer/scripts/puppeteer.js:/home/pptruser/puppeteer.js
    depends_on:
      - frontend
    shm_size: '4gb'
    cap_add:
      - 'SYS_ADMIN'

volumes:
  postgres_logs:

networks:
  storedog-network:
